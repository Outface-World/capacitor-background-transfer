# Tests fail loudly on a nil, a wrong type or a throw, which is what these rules guard against in
# the plugin itself, and a test case's name and expected values may run long.
disabled_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  # A server's error text is shown as it came, invalid UTF-8 replaced.
  - optional_data_string_conversion
  - type_body_length
type_name:
  min_length: 1
line_length:
  warning: 180
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true
