name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job gets a read-only token unless it says otherwise.
permissions:
  contents: read

env:
  NODE_VERSION: 22
  JAVA_VERSION: 21
  # What the six Gradle jobs cache: Gradle's dependencies and the wrapper's unpacked distributions
  # (the wrapper runs one on its `.ok` marker, so the zip is left out); no locks, no build outputs.
  # The keys, and which runs save: CONTRIBUTING.md, "The workflows".
  GRADLE_CACHE: |
    ~/.gradle/caches/modules-2
    !~/.gradle/caches/modules-2/*.lock
    !~/.gradle/caches/modules-2/gc.properties
    ~/.gradle/wrapper/dists
    !~/.gradle/wrapper/dists/*/*/*.zip
    !~/.gradle/wrapper/dists/*/*/*.lck

jobs:
  secrets:
    name: Secret scan
    # Every push and pull request: a key or credentials file that slipped into a commit would
    # otherwise be published with the repository. A fork's pull request fails here, since its run
    # gets no secrets and an organisation's repository needs GITLEAKS_LICENSE (CONTRIBUTING.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a pull request's commits to scan them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for a repository owned by an organisation; see CONTRIBUTING.md.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  checks:
    name: Checks (lint, Vitest, JUnit, Swift core tests, iOS build)
    runs-on: macos-15
    env:
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: The installed @capacitor/android
        id: capacitor-android
        run: echo "version=$(node -p "require('./node_modules/@capacitor/android/package.json').version")" >> "$GITHUB_OUTPUT"
      # The key names all that fixes the job's dependency set: the Gradle files and the
      # @capacitor/android that settings.gradle includes. A miss restores the job's newest cache; a job
      # that passes with no exact hit saves (a pull request's cache stays with that pull request).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: gradle-${{ runner.os }}-checks-${{ steps.capacitor-android.outputs.version }}-${{ hashFiles('android/build.gradle', 'android/settings.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-checks-
      # SwiftLint's release binary at an exact version, checked against its published SHA-256 digest.
      - name: Install SwiftLint
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          printf '%s  swiftlint.zip\n' "$SWIFTLINT_SHA256" | shasum -a 256 -c -
          unzip -q swiftlint.zip swiftlint -d "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          swiftlint version
          npm run lint
      - name: Typecheck, Vitest and build
        run: npm run typecheck && npm test && npm run build
      - name: Android unit tests
        run: npm run test:android
      - name: iOS core tests
        run: npm run test:ios
      # macOS runners have no Docker, so the Swift tests' servers run natively here: MinIO built
      # from its own repository at a pinned release (it no longer publishes binaries or images, and
      # Homebrew's formula is deprecated), Azurite from npm at a pinned version, and the harness.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build MinIO
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          git clone --depth 1 --branch "$MINIO_RELEASE" https://github.com/minio/minio "$RUNNER_TEMP/minio-src"
          (cd "$RUNNER_TEMP/minio-src" && go build -o "$RUNNER_TEMP/minio" .)
      - name: Start MinIO, Azurite and the harness
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data" "$RUNNER_TEMP/azurite"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          nohup npx --yes azurite@3.37.0 azurite-blob --blobHost 127.0.0.1 --blobPort 10000 --location "$RUNNER_TEMP/azurite" --skipApiVersionCheck --loose > "$RUNNER_TEMP/azurite.log" 2>&1 &
          S3_UPSTREAM=http://127.0.0.1:9000 AZURE_UPSTREAM=http://127.0.0.1:10000 nohup node test-servers/harness.mjs > "$RUNNER_TEMP/harness.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:8790/health && break; sleep 2; done
          curl -fs http://localhost:8790/health
      - name: iOS core tests against the servers
        env:
          BT_HARNESS: http://localhost:8790
        run: npm run test:ios
      # It resolves the newest capacitor-swift-pm, whose Capacitor 8 binaries need Xcode 26.
      - name: iOS build
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: npm run verify:ios

  # The plugin against each Capacitor it supports (test-matrix/): the first and the newest release of
  # each major, `7` and `8` being looked up when the job runs. Installed from the packed tarball into
  # apps made by that Capacitor's own CLI. A cell that can't run on its runner fails its job.
  capacitor-linux:
    name: Capacitor ${{ matrix.capacitor }} (JavaScript and Android)
    strategy:
      fail-fast: false
      matrix:
        include:
          - capacitor: '7.0.0'
          - capacitor: '7'
          - capacitor: '8.0.0'
          - capacitor: '8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      # The release a major names is looked up here, so that the cache key and the matrix name the
      # same one: a cell's dependency set is its Capacitor release's Android template.
      - name: The Capacitor release
        id: capacitor
        env:
          CAPACITOR: ${{ matrix.capacitor }}
        run: |
          set -euo pipefail
          release="$(npm view "@capacitor/core@$CAPACITOR" version --json | jq -r 'if type == "array" then .[] else . end' | sort -V | tail -n 1)"
          echo "Capacitor $CAPACITOR is $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: gradle-${{ runner.os }}-capacitor-${{ matrix.capacitor }}-${{ steps.capacitor.outputs.release }}-${{ hashFiles('android/build.gradle', 'android/settings.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-capacitor-${{ matrix.capacitor }}-
      - name: JavaScript and Android cells
        env:
          CAPACITOR: ${{ steps.capacitor.outputs.release }}
          CELLS: js,android-app,android-tests
        run: npm run test:matrix -- "$CAPACITOR" --cells "$CELLS"

  capacitor-macos:
    name: Capacitor ${{ matrix.capacitor }} (iOS)
    strategy:
      fail-fast: false
      matrix:
        # Capacitor 7 is built with the runner's Xcode 16, Capacitor 8 needs Xcode 26. CocoaPods
        # only with the newest release of each.
        include:
          - capacitor: '7.0.0'
            xcode: Xcode_16.4
            cells: ios-spm
          - capacitor: '7'
            xcode: Xcode_16.4
            cells: ios-spm,ios-cocoapods
          - capacitor: '8.0.0'
            xcode: Xcode_26.3
            cells: ios-spm
          - capacitor: '8'
            xcode: Xcode_26.3
            cells: ios-spm,ios-cocoapods
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: iOS cells
        env:
          CAPACITOR: ${{ matrix.capacitor }}
          CELLS: ${{ matrix.cells }}
          DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
        run: npm run test:matrix -- "$CAPACITOR" --cells "$CELLS"

  servers-jvm:
    name: Android tests against MinIO and Azurite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: The installed @capacitor/android
        id: capacitor-android
        run: echo "version=$(node -p "require('./node_modules/@capacitor/android/package.json').version")" >> "$GITHUB_OUTPUT"
      # Keyed as in Checks.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE }}
          key: gradle-${{ runner.os }}-servers-jvm-${{ steps.capacitor-android.outputs.version }}-${{ hashFiles('android/build.gradle', 'android/settings.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-servers-jvm-
      - name: JUnit against MinIO and Azurite (compose; stops them afterwards)
        run: npm run test:servers

  workflows:
    name: Workflow checks
    # Every push and pull request: zizmor (security) and actionlint (correctness) over the
    # workflows, the release checks action and dependabot.yml. Any high or medium zizmor finding,
    # or any actionlint error, fails the job. Findings accepted on purpose carry an inline
    # `# zizmor: ignore[...]` with the reason. Both tools are release binaries at exact versions,
    # checked against their published SHA-256 digests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: 1.31.1
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor and actionlint
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  zizmor.tar.gz\n%s  actionlint.tar.gz\n' "$ZIZMOR_SHA256" "$ACTIONLINT_SHA256" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C "$bin" zizmor
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      - name: zizmor (fails on high or medium)
        run: |
          zizmor --version
          zizmor --offline --min-severity medium --format github .
      - name: actionlint
        run: |
          actionlint --version
          actionlint -color

  verify:
    name: Verify
    # The check the branch ruleset requires: every Capacitor cell and the other checks. It runs
    # whatever happened to them, because a skipped check satisfies the ruleset.
    needs: [checks, capacitor-linux, capacitor-macos, servers-jvm, workflows]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          set -eu
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOBS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$JOBS"

  dependabot-merge:
    name: Merge Dependabot update
    needs: [verify, servers-jvm, workflows]
    # Patch and minor npm security updates merge once Verify, the server tests and the workflow
    # checks pass. Major updates stay open for review, and so does any pull request that isn't
    # purely Dependabot's own: it must be opened by Dependabot, from a branch in this repository,
    # and every commit on it authored by Dependabot and signed by GitHub. Who triggered the run
    # (github.actor) isn't checked: it can be spoofed. A pull request that touches
    # .github/workflows/ or .github/actions/ (every actions update does) stays open for a person to
    # merge: GITHUB_TOKEN can't be given the workflows permission a merge of it needs.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge merges into main
      pull-requests: write # and closes the pull request
    steps:
      - name: Every commit is Dependabot's own
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One line per commit: sha, author, committer, whether GitHub verified its signature.
          commits="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | [.sha, (.author.login // "-"), (.committer.login // "-"), (.commit.verification.verified | tostring)] | @tsv')"
          own=true
          last=
          while IFS=$'\t' read -r sha author committer verified; do
            last="$sha"
            if [ "$author" = 'dependabot[bot]' ] && [ "$committer" = web-flow ] && [ "$verified" = true ]; then
              echo "$sha: authored by dependabot[bot], signed by GitHub"
            else
              echo "::warning::$sha (author ${author:--}, committer ${committer:--}, verified ${verified:--}) isn't Dependabot's own commit: leaving the pull request open"
              own=false
            fi
          done <<< "$commits"
          if [ "$last" != "$HEAD_SHA" ]; then
            echo "::warning::the pull request's head is ${last:-unknown} now, not the $HEAD_SHA this run tested: leaving it open"
            own=false
          fi
          echo "dependabot-only=$own" >> "$GITHUB_OUTPUT"
      - name: Nothing a person has to merge
        id: files
        if: steps.commits.outputs.dependabot-only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          workflow_files="$(grep -E '^\.github/(workflows|actions)/' <<< "$files" || true)"
          if [ -n "$workflow_files" ]; then
            echo "::notice::this pull request changes the workflows, which GITHUB_TOKEN can't merge: a person must review and merge it ($(tr '\n' ' ' <<< "$workflow_files"))"
            echo "needs-person=true" >> "$GITHUB_OUTPUT"
          else
            echo "no file under .github/workflows/ or .github/actions/"
            echo "needs-person=false" >> "$GITHUB_OUTPUT"
          fi
      - id: metadata
        if: steps.commits.outputs.dependabot-only == 'true' && steps.files.outputs.needs-person == 'false'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # --match-head-commit: if anything is pushed after the check above, GitHub refuses the merge.
      - if: >-
          steps.commits.outputs.dependabot-only == 'true' &&
          steps.files.outputs.needs-person == 'false' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
