# SwiftLint's rules for `npm run swiftlint`. The size limits sit just above the code as it is, so a
# function, type or file that grows past them is flagged. `ios/Tests/.swiftlint.yml` relaxes the
# rules that suit the plugin's own code only.
excluded:
  - node_modules
  - ios/Pods
  - example-app
  - "**/.build"
opt_in_rules:
  - implicitly_unwrapped_optional
  - file_name_no_space
  - force_unwrapping
  - function_default_parameter_at_end
  - lower_acl_than_parent
  - modifier_order
  - overridden_super_call
  - unowned_variable_capture
analyzer_rules:
  - unused_import
line_length:
  warning: 150
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true
# Short names (`r` for a record, `n` for a part number) are the code's convention.
identifier_name:
  min_length: 1
cyclomatic_complexity:
  warning: 25
  error: 35
function_body_length:
  warning: 90
  error: 120
function_parameter_count:
  warning: 6
  error: 8
type_body_length:
  warning: 850
  error: 1000
file_length:
  warning: 1100
  error: 1300
large_tuple:
  warning: 4
  error: 5
